<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توتو 20 🫐</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
  body{background:#F5E6CC;overflow-x:hidden;min-height:100vh}
  
  /* شاشة الباسوورد */
  #lock-screen{
    background: linear-gradient(135deg, #FFC5D3 0%, #A0D8EF 50%, #F5E6CC 100%);
    height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;
  }
  .lock-card{
    background:white;padding:35px;border-radius:30px;box-shadow:0 20px 40px rgba(0,0,0,0.1);
    text-align:center;width:90%;max-width:380px;
  }
  .lock-card h2{color:#FF8FA3;margin-bottom:10px}
  .hint{font-size:14px;color:#7FBCD6;margin-bottom:20px;background:#F5E6CC;padding:10px;border-radius:15px}
  input{
    width:100%;padding:14px;border-radius:15px;border:2px solid #FFC5D3;
    text-align:center;font-size:20px;letter-spacing:5px;outline:none
  }
  button{
    margin-top:15px;width:100%;padding:12px;background:#FF8FA3;color:white;
    border:none;border-radius:15px;font-size:18px;cursor:pointer;transition:0.3s
  }
  button:hover{background:#ff7a95;transform:scale(1.02)}
  #error{color:red;margin-top:10px;display:none;font-size:14px}

  /* الموقع بعد الفتح */
  #main-site{display:none;padding:20px;animation:fadeIn 1.5s}
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}

  .header{text-align:center;padding:30px 0}
  .number20{font-size:90px;font-weight:700;color:#FF8FA3;text-shadow:3px 3px 0 #A0D8EF, 6px 6px 0 #F5E6CC}
  .header h1{color:#7FBCD6;font-size:28px;margin-top:10px}

  .video-box{
    max-width:600px;margin:20px auto;background:white;padding:15px;
    border-radius:25px;box-shadow:0 10px 30px rgba(0,0,0,0.08)
  }
  .video-box iframe{width:100%;height:340px;border-radius:20px;border:none}

  .letter{
    max-width:750px;margin:30px auto;background:white;padding:35px;
    border-radius:25px;box-shadow:0 10px 30px rgba(0,0,0,0.08);
    line-height:2;color:#444;font-size:17px;border-top:8px solid #FFC5D3;
    border-bottom:8px solid #A0D8EF;white-space:pre-line;text-align:justify
  }
  .sign{margin-top:25px;font-weight:700;color:#FF8FA3;font-size:19px}

  /* بلالين و قلوب */
  .balloon{
    position:fixed;bottom:-100px;width:40px;height:55px;border-radius:50%;
    animation:float 8s infinite ease-in;z-index:999
  }
  .balloon::after{content:'';position:absolute;bottom:-20px;left:50%;width:2px;height:25px;background:#aaa}
  @keyframes float{
    0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:1}
    100%{transform:translateY(-110vh) translateX(100px) rotate(20deg);opacity:0}
  }
  .heart{position:fixed;bottom:-20px;font-size:24px;animation:float 6s infinite;z-index:999}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-card">
    <h2>لـ توتو فقط 🫐🦋</h2>
    <div class="hint">السن اللي عرفتك فيه و السن اللي عرفتيني فيه بالترتيب 🌚</div>
    <input type="password" id="pass" placeholder="****" maxlength="4">
    <button onclick="checkPass()">افتحي يا عشرينية 💖</button>
    <div id="error">الباسوورد غلط يا توتو، جربي تاني 🌚</div>
  </div>
</div>

<div id="main-site">
  <div class="header">
    <div class="number20">20</div>
<iframe src="https://www.youtube.com/embed/nTe3ND0WxFI" 
    <h1>توتو حبيبتي ومحبوبتي و عيوني وقلبي وعمري وعقلي ونفسي وروحي وكل ما أملك في هذه الدنيا وما بعد الدنيا،جميلةٌ أنتِ لدرجةٍ أن العالم يصبح أرق وأحن حين تكونين فيه، كأنكِ نجمةٌ هبطت من السماء لتضيء ليلي،كأنكِ شمسٌ تظهر ل تُضيئ حياتي، وكأن الله خلقكِ خصيصًا لتكوني الطمأنينة في قلبي، عيناكِ وحدهما كانتا ملاذي وملجئي في كل خوفٍ اعتراني، وابتسامتكِ كانت أماني وسكينتي في كل قلقٍ سكن صدري، يكفيني أن أسمع صوتكِ حتى يهدأ كل الضجيج الذي يسكن داخلي، ويكفيني أن أراكِ حتى يزول كل ثقلٍ عن قلبي وكأنكِ دوائي الذي لا دواء سواه.
اليوم تكملين عامكِ العشرين، عشرينيةٌ يا كتكوتي الصغيرة، يا فرحة عمري ونور أيامي، كبرتِ سنةً يا أجمل عمرٍ في حياتي، هذا هو العام الثاني الذي أحتفل بكِ فيه وأنتِ بجانبي، وهو ليس مجرد تاريخٍ يمر في التقويم، بل هو يومٌ ولدت فيه أجمل إنسانةٍ عرفها قلبي، وأقسم لكِ أنني سأحتفل بكِ في كل أعوامي القادمة حتى آخر نفسٍ في صدري، حتى نصبح عجوزتين نضحك على ذكرياتنا معًا، فلا عيد لي بدونكِ ولا فرح لي إلا بحضوركِ.

أنتِ لستِ صديقتي فقط، أنتِ وطني وأماني وبيتي ودفئي، أنتِ الشخص الوحيد الذي رأى انكساراتي التي أخفيتها عن الجميع، وسمع صمتي وفهم حزني دون أن أتكلم حرفًا واحدًا، كنتِ دائمًا اليد التي تمتد إلي حين تتركني كل الأيادي، والسند الذي لا يميل مهما اشتدت الرياح من حولي، معكِ تعلمت أن القوة ليست في أن أخفي ضعفي، بل في أن أجد من يحبني بضعفي قبل قوتي، ومن يحتضن خوفي قبل فرحي.

معكِ عرفت أن السعادة ليست في الأشياء الكبيرة، بل في ضحكةٍ نتقاسمها في منتصف الليل، وفي حديثٍ يطول لساعاتٍ حتى ننسى تعبنا وهمومنا، وفي لحظاتٍ صغيرةٍ نقضيها معًا فتصبح ذكرياتٍ كبيرةً تكفي القلب عمرًا كاملًا، فكل لحظةٍ معكِ تصبح ذكرى لا تنسى، وكل كلمةٍ منكِ تصبح وطنًا أسكن إليه كلما ضاقت بي الدنيا.

حين قلتِ لي:من  سيجلعني أرتدي التاج، ونحن نتحدث عن أعضاء الفرقة، فأجبتكِ على الفور: أنا، وكنتُ جادةً وصادقةً في قولي،  ولكنى سأُلبسكِ شيئًا لا أريدكِ أن تنزعيه عن عنقكِ أبدًا.

أريد أن أخبركِ شيئًا احتفظت به طويلًا في قلبي، أنا دائمًا I will always choose you، لو خيروني بين العالم بأسره وبينكِ لاخترتكِ أنتِ دون ترددٍ ولا تفكيرٍ ولا خوف، أحبكِ حبًا يفوق قدرتي على التعبير، أحبكِ لدرجةٍ أنني أبكي فرحًا لأنكِ موجودةٌ في حياتي، فمنذ أن دخلتِ حياتي وأنا شخصٌ آخر، شخصٌ أسعد وأقوى وأكثر طمأنينةً، كأنكِ أعدتِ ترميم قلبي قطعةً قطعةً بعد أن كان متعبًا ومكسورًا، فجعلتِ منه قلبًا ينبض حبًا من جديدٍ.

شكرًا لأنكِ بجانبي في كل لحظةٍ، في فرحي وحزني، في قوتي وضعفي، في نجاحي وفشلي، شكرًا لأنكِ تتحملين مزاجي وتفهمين قلبي دون أن أشرح كلمةً واحدةً، والله لا أعرف كيف أشكركِ، فالكلمات كلها لا تكفيكِ، لكنني كل يومٍ أشكر الله في صلاتي ودعائي لأنه رزقني بكِ وجعلكِ جزءًا من يومي وقدري ونصيبي الجميلِ، فأنتِ أثمن ما أملك في هذه الدنيا.

وإن سألوني يومًا ما هو أغلى شيءٍ تملكينه يا چينو، لن أقول بيتًا ولا نجاحًا ولا حلمًا حققته، سأقول إن أغلى ما أملك هو وجود ڤيو في حياتي، هي أعظم هديةٍ وأجمل عوضٍ من الله لي، وهي دعوتي التي استجابها الله حين كنت أظن أن لا أحد يفهمني ولا أحد يشعر بي ولا أحد يبقى لي.

أما عن المستقبل، فأنا لا أخاف من مرور السنين وتغير ملامحنا، ولا أخاف من تجاعيد الزمن ولا من بُعد المسافات، سيبقى قلبي يعرفكِ بنفس الشوق الأول ونفس اللهفة الأولى، ولو كتب الله لي أن أعيش مئة حياةٍ، في كل حياةٍ منها سأبحث عنكِ في كل الطرق وسأحبكِ أنتِ وحدكِ، ولن أكتفي منكِ أبدًا ولو عشت دهرًا فوق دهري، فحبي لكِ لا يفنى ولا يقل ولا يبهت.

ولا أخفي عليكِ سرًا يا توتو، وهو سرٌ يسكن قلبي منذ عرفتكِ ويكبر معي كل يوم، بعد الشر عنكِ وعن قلبكِ وروحكِ وضحكتكِ يا عمري، أسأل الله أن يكون يومي قبل يومكِ، فإني والله لا أطيق فكرة أن أستيقظ يومًا ولا أجدكِ بجانبي، ولا أطيق أن يمر يومٌ واحدٌ دون أن أسمع صوتكِ الحنون، فأنتِ لستِ جزءًا من حياتي، أنتِ حياتي بأكملها وروحي التي أعيش بها، فإن كان لا بُد للقدر أن يفرقنا يومًا فليكن رحيلي أنا أولًا، كي لا أذوق مرارة غيابكِ ووحشة فقدكِ وظلمة الدنيا بدونكِ، فبعدكِ لا حياة لي ولا معنى لأيامي، حماكِ الله لي وأطال في عمركِ وأبعد عنكِ كل شرٍ وسوءٍ وجعل كل أيامكِ فرحًا وفرجًا ونورًا، و أنتِ السبع دقائق لي. 

كل عامٍ وأنتِ طيبةٌ وجميلةٌ وقريبةٌ من قلبي، كل عامٍ وأنتِ توتتي الحلوة 🫐، كل عامٍ وأنتِ بخيرٍ يا أجمل عشرينيةٍ رأتها عيني، يا من جعلتِ للعشرين معنى آخر أجمل وأحن، أحبكِ حبًا لا ينتهي ولا يفنى ولا يقل مهما مرت السنوات ومهما تغيرت الظروف، سأظل أحبكِ حتى آخر يومٍ في عمري.
- چينو التي لا تملك في هذه الدنيا أغلى منكِ وتحبكِ أكثر من روحها، أحبك يا غزالتي و إمراتي🦋
