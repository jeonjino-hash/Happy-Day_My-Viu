<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عيد ميلاد ڤيو 🎈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root{--rose:#f2a7bb;--rose-soft:#fbd5df;--milk:#fff8f1;--beige:#ead8c4;--ink:#7a3049;--ink-soft:#a5677c}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Amiri','Traditional Arabic',serif;color:var(--ink);background:linear-gradient(180deg,var(--milk) 0%,#fdeee9 55%,var(--beige) 100%);background-attachment:fixed;overflow-x:hidden}
.num{font-family:'Reem Kufi','Amiri',sans-serif;font-weight:600;line-height:1;color:var(--rose);text-shadow:0 6px 0 var(--beige),0 12px 24px rgba(242,167,187,.45)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.b{position:absolute;bottom:-140px;width:var(--s);height:calc(var(--s)*1.22);border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 10%,transparent 11%),var(--c);animation:up var(--d) linear var(--w) infinite;opacity:.9}
.b::after{content:"";position:absolute;top:100%;left:50%;width:1px;height:calc(var(--s)*.9);background:rgba(122,48,73,.35)}
.h{position:absolute;bottom:-40px;font-size:var(--s);animation:up var(--d) ease-in var(--w) infinite}
@keyframes up{to{transform:translateY(-120vh) translateX(var(--x,20px))}}
section{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
#lock .num{font-size:clamp(120px,34vw,210px)}
#lock h1{font-size:clamp(22px,5vw,30px);margin:6px 0 18px}
.hint{max-width:420px;font-size:clamp(18px,4.4vw,22px);line-height:1.9;color:var(--ink-soft);margin-bottom:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
input{font:inherit;font-size:22px;width:170px;text-align:center;letter-spacing:6px;padding:10px 14px;border:2px solid var(--rose);border-radius:16px;background:var(--milk);color:var(--ink);direction:ltr}
input:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button{font:inherit;font-size:20px;font-weight:700;padding:10px 26px;border:0;border-radius:16px;background:var(--rose);color:#fff;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.95)}
#err{min-height:30px;margin-top:12px;color:#b13a5c}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#main{display:none}
#main.on{display:block}
#main section{min-height:0;padding:48px 18px}
.top{min-height:70vh!important}
.top .num{font-size:clamp(130px,40vw,260px)}
.top h2{font-size:clamp(26px,7vw,40px)}
.card{width:100%;max-width:680px;background:rgba(255,248,241,.92);border:2px solid var(--rose-soft);border-radius:28px;padding:clamp(22px,5vw,44px);box-shadow:0 18px 40px rgba(122,48,73,.12);text-align:right}
.card p{font-size:clamp(20px,4.9vw,24px);line-height:2.1;margin-bottom:1.1em}
.card p:last-child{margin-bottom:0}
.end{text-align:center!important;color:var(--ink);font-weight:700}
.sig{display:block;margin-top:.6em;color:var(--ink-soft)}
.vid{width:100%;max-width:680px;aspect-ratio:16/9;border:0;border-radius:24px;box-shadow:0 18px 40px rgba(122,48,73,.18);background:var(--beige)}
.vid-t{font-size:26px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){.b,.h{animation:none;bottom:20%}}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>

<section id="lock">
  <div class="num">20</div>
  <h1>🎈 عيد ميلاد ڤيو 🎈</h1>
  <p class="hint">السن اللي عرفتك فيه و السن اللي عرفتيني فيه بالترتيب 🌚</p>
  <div class="row">
    <input id="pw" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" aria-label="كلمة السر">
    <button id="go">افتحي</button>
  </div>
  <div id="err" role="alert"></div>
</section>
  <!-- شاشة القفل -->
<div id="lock-screen">
  <div class="lock-card">
    <h2>لـ توتو فقط 🫐🦋</h2>
    <div class="hint">السن اللي عرفتك فيه و السن اللي عرفتيني فيه بالترتيب 🌚</div>
    <input type="password" id="pass" placeholder="****" maxlength="4">
    <button onclick="checkPass()">افتحي يا عشرينية 💖</button>
    <div id="error">الباسوورد غلط يا توتو، جربي تاني 🌚</div>
  </div>
</div>

<script>
function checkPass(){
  let p = document.getElementById("pass").value.trim();
  if(p === "1719" || p === "١٧١٩"){
    document.getElementById("lock-screen").style.display="none";
    document.getElementById("main-site").style.display="block";
  } else {
    document.getElementById("error").style.display="block";
  }
}

// تفتح لما تدوسي Enter
document.getElementById("pass").addEventListener("keypress", function(e){
  if(e.key === "Enter"){ checkPass(); }
});
</script>
<div id="main">
  <section class="top">
    <div class="num">20</div>
    <h2>كل عام وأنتِ توتتي 🫐</h2>
  </section>
<iframe src="https://www.youtube.com/embed/nTe3ND0WxFI" 
  <section>
    <article class="card">
      <p>توتو حبيبتي ومحبوبتي و عيوني وقلبي وعمري وعقلي ونفسي وروحي وكل ما أملك في هذه الدنيا وما بعد الدنيا،جميلةٌ أنتِ لدرجةٍ أن العالم يصبح أرق وأحن حين تكونين فيه، كأنكِ نجمةٌ هبطت من السماء لتضيء ليلي،كأنكِ شمسٌ تظهر ل تُضيئ حياتي، وكأن الله خلقكِ خصيصًا لتكوني الطمأنينة في قلبي، عيناكِ وحدهما كانتا ملاذي وملجئي في كل خوفٍ اعتراني، وابتسامتكِ كانت أماني وسكينتي في كل قلقٍ سكن صدري، يكفيني أن أسمع صوتكِ حتى يهدأ كل الضجيج الذي يسكن داخلي، ويكفيني أن أراكِ حتى يزول كل ثقلٍ عن قلبي وكأنكِ دوائي الذي لا دواء سواه.</p>
      <p>اليوم تكملين عامكِ العشرين، عشرينيةٌ يا كتكوتي الصغيرة، يا فرحة عمري ونور أيامي، كبرتِ سنةً يا أجمل عمرٍ في حياتي، هذا هو العام الثاني الذي أحتفل بكِ فيه وأنتِ بجانبي، وهو ليس مجرد تاريخٍ يمر في التقويم، بل هو يومٌ ولدت فيه أجمل إنسانةٍ عرفها قلبي، وأقسم لكِ أنني سأحتفل بكِ في كل أعوامي القادمة حتى آخر نفسٍ في صدري، حتى نصبح عجوزتين نضحك على ذكرياتنا معًا، فلا عيد لي بدونكِ ولا فرح لي إلا بحضوركِ.</p>
      <p>أنتِ لستِ صديقتي فقط، أنتِ وطني وأماني وبيتي ودفئي، أنتِ الشخص الوحيد الذي رأى انكساراتي التي أخفيتها عن الجميع، وسمع صمتي وفهم حزني دون أن أتكلم حرفًا واحدًا، كنتِ دائمًا اليد التي تمتد إلي حين تتركني كل الأيادي، والسند الذي لا يميل مهما اشتدت الرياح من حولي، معكِ تعلمت أن القوة ليست في أن أخفي ضعفي، بل في أن أجد من يحبني بضعفي قبل قوتي، ومن يحتضن خوفي قبل فرحي.</p>
      <p>معكِ عرفت أن السعادة ليست في الأشياء الكبيرة، بل في ضحكةٍ نتقاسمها في منتصف الليل، وفي حديثٍ يطول لساعاتٍ حتى ننسى تعبنا وهمومنا، وفي لحظاتٍ صغيرةٍ نقضيها معًا فتصبح ذكرياتٍ كبيرةً تكفي القلب عمرًا كاملًا، فكل لحظةٍ معكِ تصبح ذكرى لا تنسى، وكل كلمةٍ منكِ تصبح وطنًا أسكن إليه كلما ضاقت بي الدنيا.</p>
      <p>حين قلتِ لي:من  سيجلعني أرتدي التاج، ونحن نتحدث عن أعضاء الفرقة، فأجبتكِ على الفور: أنا، وكنتُ جادةً وصادقةً في قولي،  ولكنى سأُلبسكِ شيئًا لا أريدكِ أن تنزعيه عن عنقكِ أبدًا.</p>
      <p>أريد أن أخبركِ شيئًا احتفظت به طويلًا في قلبي، أنا دائمًا I will always choose you، لو خيروني بين العالم بأسره وبينكِ لاخترتكِ أنتِ دون ترددٍ ولا تفكيرٍ ولا خوف، أحبكِ حبًا يفوق قدرتي على التعبير، أحبكِ لدرجةٍ أنني أبكي فرحًا لأنكِ موجودةٌ في حياتي، فمنذ أن دخلتِ حياتي وأنا شخصٌ آخر، شخصٌ أسعد وأقوى وأكثر طمأنينةً، كأنكِ أعدتِ ترميم قلبي قطعةً قطعةً بعد أن كان متعبًا ومكسورًا، فجعلتِ منه قلبًا ينبض حبًا من جديدٍ.</p>
      <p>شكرًا لأنكِ بجانبي في كل لحظةٍ، في فرحي وحزني، في قوتي وضعفي، في نجاحي وفشلي، شكرًا لأنكِ تتحملين مزاجي وتفهمين قلبي دون أن أشرح كلمةً واحدةً، والله لا أعرف كيف أشكركِ، فالكلمات كلها لا تكفيكِ، لكنني كل يومٍ أشكر الله في صلاتي ودعائي لأنه رزقني بكِ وجعلكِ جزءًا من يومي وقدري ونصيبي الجميلِ، فأنتِ أثمن ما أملك في هذه الدنيا.</p>
      <p>وإن سألوني يومًا ما هو أغلى شيءٍ تملكينه يا چينو، لن أقول بيتًا ولا نجاحًا ولا حلمًا حققته، سأقول إن أغلى ما أملك هو وجود ڤيو في حياتي، هي أعظم هديةٍ وأجمل عوضٍ من الله لي، وهي دعوتي التي استجابها الله حين كنت أظن أن لا أحد يفهمني ولا أحد يشعر بي ولا أحد يبقى لي.</p>
      <p>أما عن المستقبل، فأنا لا أخاف من مرور السنين وتغير ملامحنا، ولا أخاف من تجاعيد الزمن ولا من بُعد المسافات، سيبقى قلبي يعرفكِ بنفس الشوق الأول ونفس اللهفة الأولى، ولو كتب الله لي أن أعيش مئة حياةٍ، في كل حياةٍ منها سأبحث عنكِ في كل الطرق وسأحبكِ أنتِ وحدكِ، ولن أكتفي منكِ أبدًا ولو عشت دهرًا فوق دهري، فحبي لكِ لا يفنى ولا يقل ولا يبهت.</p>
      <p>ولا أخفي عليكِ سرًا يا توتو، وهو سرٌ يسكن قلبي منذ عرفتكِ ويكبر معي كل يوم، بعد الشر عنكِ وعن قلبكِ وروحكِ وضحكتكِ يا عمري، أسأل الله أن يكون يومي قبل يومكِ، فإني والله لا أطيق فكرة أن أستيقظ يومًا ولا أجدكِ بجانبي، ولا أطيق أن يمر يومٌ واحدٌ دون أن أسمع صوتكِ الحنون، فأنتِ لستِ جزءًا من حياتي، أنتِ حياتي بأكملها وروحي التي أعيش بها، فإن كان لا بُد للقدر أن يفرقنا يومًا فليكن رحيلي أنا أولًا، كي لا أذوق مرارة غيابكِ ووحشة فقدكِ وظلمة الدنيا بدونكِ، فبعدكِ لا حياة لي ولا معنى لأيامي، حماكِ الله لي وأطال في عمركِ وأبعد عنكِ كل شرٍ وسوءٍ وجعل كل أيامكِ فرحًا وفرجًا ونورًا، و أنتِ السبع دقائق لي.</p>
